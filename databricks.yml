# Declarative Automation Bundle for the IoT Digital Twin app.
# All workspace-specific values are variables with placeholders; real values
# come from the (gitignored) .databricks/bundle/<target>/variable-overrides.json
# (copy deploy/variable-overrides.json.example), `--var name=value` or BUNDLE_VAR_<name>.
# Workspace-specific variables deliberately have NO default, so a missing value
# fails validation instead of deploying placeholders. See docs/deployment.md.
bundle:
  name: iot-digital-twin

include:
  - resources/*.yml

variables:
  app_name:
    description: "Databricks App name (workspace-global, <= 30 chars, lowercase/digits/hyphens). Dev default is shared: override per developer (e.g. iot-twin-dev-<initials>). Prod pins iot-digital-twin."
    default: iot-twin-dev
  uc_catalog:
    description: Unity Catalog catalog holding the twin data.
  uc_schema:
    description: Unity Catalog schema holding the twin data.
    default: rtm_lakets_zb
  warehouse_id:
    description: SQL warehouse id the app queries (granted CAN_USE).
  genie_space_id:
    description: Genie space id for the copilot (granted CAN_VIEW).
  lakebase_project:
    description: Lakebase (Postgres) project backing the app.
  lakebase_branch:
    description: Lakebase branch id.
    default: production
  lakebase_database:
    description: Lakebase database resource id inside the branch.
    default: databricks-postgres
  pghost:
    description: Lakebase endpoint host (PGHOST).
  pipelines_lakebase_project:
    description: Lakebase project used for per-pipeline streaming sinks.
  msk_bootstrap_servers:
    description: Comma-separated MSK bootstrap servers.
  zerobus_server_endpoint:
    description: Zerobus ingest endpoint host.
  zerobus_client_id:
    description: Service principal client id used by Zerobus producers.
  uc_service_credential:
    description: UC service credential used for MSK access.
  zerobus_secret_key:
    description: "Secret key for the Zerobus client secret. Non-empty by necessity (the Apps API rejects empty env values); default equals the runtime default."
    default: zerobus-client-secret
  industries:
    description: Comma-separated enabled industries.
    default: manufacturing,pharmaceutical
  admin_group:
    description: Workspace group whose members are app admins.
    default: iot-admins
  usage_tracking_enabled:
    description: Usage tracking via dbdemos-tracker ("false" to opt out).
    default: "true"
  # Spindle 3 thermal-risk model (resources/risk_model.yml, docs/ml-risk-model.md).
  risk_model_schema:
    description: UC schema (in uc_catalog) holding the registered thermal-risk model.
    default: pharma_twin
  risk_model_short_name:
    description: UC model name; the full name is <uc_catalog>.<risk_model_schema>.<this>.
    default: spindle_thermal_risk
  risk_model_version:
    description: Model version the endpoint serves at deploy; the training job repoints it to the champion.
    default: "1"
  risk_endpoint_name:
    description: Model Serving endpoint for the thermal-risk model.
    default: pharma-twin-spindle-risk
  risk_job_name:
    description: Training job name.
    default: pharma-twin-risk-model-train
  risk_training_data_source:
    description: "auto (real telemetry when it has enough excursions, else synthetic), synthetic or real."
    default: auto
  risk_alert_threshold:
    description: Risk score at or above which the app opens a predicted alert (the job logs the chosen cut-off).
    default: "0.22"

# Ships the built SPA (static/dist is tracked), the package, app.yaml, the
# vendored wheels (simulator, dbdemos-tracker) and requirements. Replaces .databricksignore.
sync:
  include:
    - static/dist/**
    - lib/*.whl
  exclude:
    - client/
    - docs/
    - tests/
    - tests/e2e/
    - scripts/
    - deploy/
    - .github/
    - Makefile
    - README.md
    - .pre-commit-config.yaml
    - .gitleaks.toml
    - .editorconfig

targets:
  dev:
    mode: development
    default: true
    # workspace host is taken from --profile / DATABRICKS_CONFIG_PROFILE; never committed.

  # WARNING: prod resolves to the LIVE app name (iot-digital-twin). Always run
  # `databricks bundle deployment bind iot_twin iot-digital-twin -t prod` first,
  # review `databricks bundle plan -t prod`, and never deploy without prod
  # overrides (.databricks/bundle/prod/variable-overrides.json): the workspace
  # variables have no defaults and validation fails until they are provided.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: iot-digital-twin
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
      - level: CAN_MANAGE
        group_name: ${var.admin_group}
