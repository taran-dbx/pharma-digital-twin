command:
  - "/bin/sh"
  - "-c"
  - "uvicorn --app-dir src iot_twin.app:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8000}"

env:
  - name: UC_CATALOG
    value: "example-catalog"

  - name: UC_SCHEMA
    value: "rtm_lakets_zb"

  - name: PGHOST
    value: "example-lakebase.database.us-east-1.cloud.databricks.com"

  - name: PGDATABASE
    value: "databricks_postgres"

  - name: PGPORT
    value: "5432"

  - name: LAKEBASE_PROJECT
    value: "iot-app-backend-example"

  - name: LAKEBASE_ENDPOINT
    value: "projects/iot-app-backend-example/branches/production/endpoints/primary"

  - name: DATABRICKS_SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse

  - name: ZEROBUS_SERVER_ENDPOINT
    value: "111111111111111.zerobus.us-east-1.cloud.databricks.com"

  - name: ZEROBUS_TABLE_NAME
    value: ""

  - name: ZEROBUS_CLIENT_ID
    value: "00000000-0000-0000-0000-00000000000b"

  - name: ZEROBUS_SECRET_SCOPE
    value: ""

  - name: ZEROBUS_SECRET_KEY
    value: ""

  - name: UC_STORAGE_BASE
    value: ""

  - name: UC_EXTERNAL_LOCATION
    value: ""

  - name: UC_SERVICE_CREDENTIAL
    value: "iot-rtm-sc"

  - name: PIPELINES_LAKEBASE_PROJECT
    value: "iot-pipelines-example"

  - name: MSK_BOOTSTRAP_SERVERS
    value: "b-1-public.example.abc123.c1.kafka.us-east-1.amazonaws.com:9198,b-2-public.example.abc123.c1.kafka.us-east-1.amazonaws.com:9198,b-3-public.example.abc123.c1.kafka.us-east-1.amazonaws.com:9198"

  - name: INDUSTRIES
    value: "pharmaceutical,manufacturing"

  - name: ADMIN_GROUP
    value: "iot-admins"

  - name: GENIE_SPACE_ID
    valueFrom: genie-space

  - name: USAGE_TRACKING_ENABLED
    value: "true"
